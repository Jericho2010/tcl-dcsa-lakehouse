  - name: silver_portgate_equipment_events_equipment_reference_pattern
    type: sql
    description: equipment_reference must match regex ^[A-Z]{4}[0-9]{7}$.
    query: SELECT COUNT(*) FROM silver_portgate_equipment_events WHERE NOT (equipment_reference
