apiVersion: v3.1.0
kind: DataContract
id: tcl-portgate-tos-events
name: TCL PortGate TOS Equipment and Transport Events
version: 1.0.0
status: active
domain: maritime-dcsa-logistics
dataProduct: tcl-portgate-tos-events
description:
  purpose: Governed DCSA Track & Trace v3 equipment handling and vessel transport
    events curated in Silver from PortGate TOS.
  usage: Auto-compiled from models/linkml/dcsa/dcsa_enterprise.yaml via tcl_compiler.compile_dcsa;
    do not edit generated schema blocks by hand.
servers:
- server: databricks_lakehouse
  type: databricks
  catalog: tcl_lakehouse
  schema: silver_dcsa
team:
  name: TCL DCSA Data Architecture
  members:
  - username: tcl-data-platform
    name: TCL Data Platform Engineering
    role: owner
slaProperties:
- property: latency
  value: '15'
  unit: minutes
  description: Maximum allowed end-to-end ingestion freshness SLA.
schema:
- name: silver_portgate_equipment_events
  physicalName: silver_portgate_equipment_events
  physicalType: table
  description: DCSA Track & Trace v3 container equipment handling event captured at
    terminal gates, quaysides, or depots.
  properties:
  - name: equipment_event_type_code
    logicalType: string
    physicalType: STRING
    description: DCSA equipment milestone code (e.g., LOAD, DISC, GTIN, GTOT).
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^(LOAD|DISC|GTIN|GTOT|STUF|STRP|PICK|DROP|INSP|RSEA|RMVD)$
  - name: equipment_reference
    logicalType: string
    physicalType: STRING
    description: ISO 6346 container identifier (e.g., TCLU1234567).
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^[A-Z]{4}[0-9]{7}$
  - name: iso_equipment_code
    logicalType: string
    physicalType: STRING
    description: 4-character ISO 6346 container size and type code (e.g., 45R1, 42G1).
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^[0-9A-Z]{4}$
  - name: empty_indicator_code
    logicalType: string
    physicalType: STRING
    description: Container load state indicator (EMPTY or LADEN).
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^(EMPTY|LADEN)$
  - name: un_location_code
    logicalType: string
    physicalType: STRING
    description: UN/LOCODE port where the equipment event occurred.
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^[A-Z]{2}[A-Z2-9]{3}$
  - name: facility_code
    logicalType: string
    physicalType: STRING
    description: SMDG terminal facility code.
    required: false
    classification: internal
  - name: transport_call_id
    logicalType: string
    physicalType: STRING
    description: Foreign reference linking vessel-side events to the port call.
    required: false
    classification: internal
  - name: carrier_voyage_number
    logicalType: string
    physicalType: STRING
    description: Operational carrier voyage identifier.
    required: false
    classification: internal
  - name: event_id
    logicalType: string
    physicalType: STRING
    description: Globally unique deterministic identifier for the DCSA event record.
    required: true
    classification: internal
    primaryKey: true
    primaryKeyPosition: 1
    unique: true
  - name: event_created_date_time
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC timestamp when the source system created the event payload.
    required: true
    classification: internal
  - name: event_date_time
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC timestamp when the operational event occurred, is estimated,
      or is planned.
    required: true
    classification: internal
  - name: event_classifier_code
    logicalType: string
    physicalType: STRING
    description: Classification of event_date_time (PLN, ACT, or EST).
    required: true
    classification: internal
    logicalTypeOptions:
      pattern: ^(PLN|ACT|EST)$
  - name: source_system
    logicalType: string
    physicalType: STRING
    description: Originating operational system identifier (e.g., portgate_tos, voyagecore_ebl).
    required: true
    classification: internal
  quality:
  - name: silver_portgate_equipment_events_equipment_event_type_code_not_null
    type: sql
    description: equipment_event_type_code must not be NULL on silver_dcsa.silver_portgate_equipment_events.
    query: SELECT COUNT(*) FROM silver_portgate_equipment_events WHERE NOT (equipment_event_type_code
      IS NOT NULL)
    mustBe: 0
    severity: error
  - name: silver_portgate_equipment_events_equipment_event_type_code_enum_values
    type: sql
    description: equipment_event_type_code must belong to DCSA enum EquipmentEventTypeCode.
    query: SELECT COUNT(*) FROM silver_portgate_equipment_events WHERE NOT (equipment_event_type_code
      IN ('LOAD', 'DISC', 'GTIN', 'GTOT', 'STUF', 'STRP', 'PICK', 'DROP', 'INSP',
