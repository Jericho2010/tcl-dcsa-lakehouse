[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcl_compiler", "src/generators", "src/pipelines", "src/jobs"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "tcl-dcsa-lakehouse"
version = "0.1.0"
description = "Tasman Container Line (TCL) DCSA Contract-and-Model-Driven Lakehouse Reference Lab"
requires-python = ">=3.11"
dependencies = [
    "linkml",
    "linkml-runtime",
    "pydantic>=2.0",
    "pyyaml",
    "datacontract-cli",
    "apache-ossie-databricks @ git+https://github.com/apache/ossie-converters.git#subdirectory=databricks",
    "apache-ossie-microsoft @ git+https://github.com/apache/ossie-converters.git#subdirectory=microsoft",
    "fastapi",
    "uvicorn",
    "databricks-sdk",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
